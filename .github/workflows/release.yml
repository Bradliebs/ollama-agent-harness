name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run typecheck
          npm test -- --runInBand
          npm run build

      - name: Package release asset
        run: |
          mkdir -p release
          cat > release-provenance.json <<EOF
          {
            "version": "${GITHUB_REF_NAME#v}",
            "commit": "${GITHUB_SHA}",
            "assetName": "ollama-agent-harness-${GITHUB_REF_NAME}.zip",
            "releaseUrl": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          zip -r "release/ollama-agent-harness-${GITHUB_REF_NAME}.zip" dist ui scripts package.json package-lock.json README.md start.bat release-provenance.json

      - name: Smoke release archive
        run: node scripts/release-smoke.js "release/ollama-agent-harness-${GITHUB_REF_NAME}.zip"

      - name: Generate release notes
        run: npm run release:notes -- --version "${GITHUB_REF_NAME}" --asset "release/ollama-agent-harness-${GITHUB_REF_NAME}.zip" --commit "${GITHUB_SHA}" --output release/release-notes.md

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release/ollama-agent-harness-${{ github.ref_name }}.zip
          name: Ollama Agent Harness ${{ github.ref_name }}
          body_path: release/release-notes.md

      - name: Verify published release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf published-release
          mkdir -p published-release
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern "ollama-agent-harness-${GITHUB_REF_NAME}.zip" --dir published-release --clobber
          node scripts/release-smoke.js "published-release/ollama-agent-harness-${GITHUB_REF_NAME}.zip"
