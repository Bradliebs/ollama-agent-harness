name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security and contracts
        run: |
          npm audit --audit-level=moderate
          node --test scripts/dependency-contract.test.js

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Launch contract
        run: node --test scripts/check-runtime.test.js scripts/background-server.test.js scripts/repair-workspace.test.js

      - name: Build
        run: npm run build

      - name: Background lifecycle integration
        run: node --test scripts/background-server.integration.test.js

      - name: Interrupted session resume integration
        run: node --test scripts/resume.integration.test.js

      - name: Development and frozen holdout contracts
        run: node --test scripts/outcome-cases.test.js scripts/local-outcomes.integration.test.js scripts/holdout-cases.test.js scripts/cloud-mode.test.js

      - name: Smoke transport
        run: npm run smoke:transport

      - name: Smoke mycelium API
        run: npm run smoke:mycelium

      - name: Install browser for interactive smoke
        run: npx playwright install --with-deps chromium

      - name: Built app outcome
        run: node --test scripts/app-outcome.integration.test.js

      - name: Start UI
        run: |
          PORT=4310 NO_OPEN=1 HARNESS_UI_SMOKE_CHAT=1 npm run ui > ui.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4310/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ui.log
          exit 1

      - name: Smoke UI
        timeout-minutes: 8
        run: npm run smoke:ui -- http://127.0.0.1:4310/

      - name: Verify CHANGELOG version section
        run: npm run verify:changelog

      - name: Verify release version metadata
        run: npm run verify:versions

      - name: Smoke release archive
        run: npm run release:dry-run

  portable-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: ubuntu-latest
            node: 22.13.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --test scripts/dependency-contract.test.js
      - run: npm run typecheck
      - run: node --test scripts/check-runtime.test.js scripts/background-server.test.js scripts/repair-workspace.test.js
      - run: npm test -- --runInBand --runTestsByPath src/setup/health.test.ts src/web/uiWiring.test.ts src/core/chatClientFactory.test.ts
      - run: npm run build
      - run: node --test scripts/background-server.integration.test.js
      - run: node --test scripts/resume.integration.test.js
      - run: node --test scripts/outcome-cases.test.js scripts/local-outcomes.integration.test.js scripts/holdout-cases.test.js scripts/cloud-mode.test.js
      - run: npm run smoke:transport
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/app-outcome.integration.test.js
      - name: Beginner setup and first-response smoke
        run: npm run smoke:beginner
      - name: Install NSIS on disposable Windows runner
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Compile Windows installer
        if: runner.os == 'Windows'
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" installer/harness-installer.nsi'
      - name: Active reinstall and uninstall preserve user data
        if: runner.os == 'Windows'
        run: npm run smoke:installer -- .\Harness-Setup.exe --install-dir "${{ runner.temp }}\Harness install"
