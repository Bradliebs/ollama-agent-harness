name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Smoke transport
        run: npm run smoke:transport

      - name: Smoke mycelium API
        run: npm run smoke:mycelium

      - name: Install browser for interactive smoke
        run: npx playwright install --with-deps chromium

      - name: Start UI
        run: |
          PORT=4310 NO_OPEN=1 npm run ui > ui.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4310/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat ui.log
          exit 1

      - name: Smoke UI
        run: npm run smoke:ui -- http://127.0.0.1:4310/

      - name: Verify CHANGELOG version section
        run: npm run verify:changelog

      - name: Smoke release archive
        run: npm run release:dry-run
